<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQL & Python Practice Arena — Dibimbing</title>
    <style>
      :root {
        --accent: #4fd6b0;
        --accent-dim: #2b6f5c;
        --warn: #e8a33d;
        --danger: #e2596b;
        --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        --sans:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      html[data-theme="dark"] {
        --bg: #0d1117;
        --panel: #11161d;
        --panel2: #161c25;
        --border: #252d3a;
        --text: #dbe2ea;
        --text-dim: #8b95a5;
        --code-bg: #0a0e13;
        --code-text: #d7f5ea;
      }
      html[data-theme="light"] {
        --bg: #f7f8fa;
        --panel: #ffffff;
        --panel2: #f0f2f5;
        --border: #dde1e7;
        --text: #1c2430;
        --text-dim: #666f7d;
        --code-bg: #f3f4f7;
        --code-text: #0f5c46;
        --accent: #1f9c78;
        --accent-dim: #bfe9dc;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        transition:
          background 0.2s,
          color 0.2s;
      }

      .topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 20px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.2px;
        cursor: pointer;
      }
      .brand .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
      }
      .test-select {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .test-select label {
        font-size: 12px;
        color: var(--text-dim);
      }
      select {
        background: var(--panel2);
        color: var(--text);
        border: 1px solid var(--border);
        padding: 7px 10px;
        border-radius: 6px;
        font-family: var(--sans);
        font-size: 13px;
        cursor: pointer;
      }
      .progress-chip {
        font-size: 12px;
        color: var(--text-dim);
        background: var(--panel2);
        border: 1px solid var(--border);
        padding: 6px 10px;
        border-radius: 999px;
      }
      .progress-chip b {
        color: var(--accent);
        font-weight: 700;
      }
      .theme-toggle {
        background: var(--panel2);
        border: 1px solid var(--border);
        color: var(--text);
        width: 34px;
        height: 34px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .layout {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .sidebar {
        width: 250px;
        flex-shrink: 0;
        background: var(--panel);
        border-right: 1px solid var(--border);
        overflow-y: auto;
        padding: 14px 10px;
      }
      .sidebar-section-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-dim);
        padding: 6px 10px 8px;
      }
      .tab-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 10px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 13px;
        color: var(--text-dim);
        margin-bottom: 2px;
        border: 1px solid transparent;
      }
      .tab-item:hover {
        background: var(--panel2);
        color: var(--text);
      }
      .tab-item.active {
        background: var(--panel2);
        color: var(--text);
        border-color: var(--border);
      }
      .tab-item.active .num {
        background: var(--accent);
        color: #06231c;
      }
      .tab-item .num {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: var(--panel2);
        color: var(--text-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .tab-item.done .num {
        background: var(--accent-dim);
        color: var(--accent);
      }
      .tab-item .name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tab-item .typebadge {
        font-size: 9px;
        padding: 1px 5px;
        border-radius: 4px;
        border: 1px solid var(--border);
        color: var(--text-dim);
        flex-shrink: 0;
      }
      .tab-item.home,
      .tab-item.tutorial {
        color: var(--warn);
      }
      .tab-item.home .num,
      .tab-item.tutorial .num {
        background: rgba(232, 163, 61, 0.15);
        color: var(--warn);
      }
      .tab-hidden-note {
        padding: 14px 10px;
        font-size: 12px;
        color: var(--text-dim);
        line-height: 1.5;
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 10px 4px;
      }

      .main {
        flex: 1;
        overflow-y: auto;
        padding: 28px 40px 80px;
        max-width: 980px;
      }
      .qhead {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 4px;
        flex-wrap: wrap;
      }
      .qhead h1 {
        font-size: 20px;
        margin: 0;
        font-weight: 700;
      }
      .qtag {
        font-size: 11px;
        color: var(--accent);
        background: rgba(79, 214, 176, 0.1);
        border: 1px solid var(--accent-dim);
        padding: 3px 9px;
        border-radius: 999px;
      }
      .qtag.py {
        color: #e8c04d;
        background: rgba(232, 192, 77, 0.1);
        border-color: #7a651f;
      }
      .qmeta {
        color: var(--text-dim);
        font-size: 13px;
        margin-bottom: 22px;
      }

      .section {
        margin-bottom: 26px;
      }
      .section h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section h2::before {
        content: "";
        width: 3px;
        height: 13px;
        background: var(--accent);
        border-radius: 2px;
      }
      .prose {
        font-size: 14.5px;
        line-height: 1.7;
        color: var(--text);
        white-space: pre-wrap;
      }
      pre.datablock {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        overflow-x: auto;
        font-family: var(--mono);
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--code-text);
        white-space: pre;
      }

      textarea.answer {
        width: 100%;
        min-height: 160px;
        background: var(--code-bg);
        border: 1px solid var(--border);
        color: var(--code-text);
        font-family: var(--mono);
        font-size: 13.5px;
        line-height: 1.6;
        border-radius: 8px;
        padding: 14px;
        resize: vertical;
      }
      textarea.answer:focus {
        outline: none;
        border-color: var(--accent-dim);
      }

      .btnrow {
        display: flex;
        gap: 10px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      button.btn {
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 600;
        padding: 9px 16px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--panel2);
        color: var(--text);
        cursor: pointer;
        transition: background 0.15s;
      }
      button.btn:hover {
        background: var(--border);
      }
      button.btn.primary {
        background: var(--accent);
        color: #06231c;
        border-color: var(--accent);
      }
      button.btn.primary:hover {
        filter: brightness(1.08);
      }
      button.btn.mark {
        background: transparent;
        border-color: var(--accent-dim);
        color: var(--accent);
      }

      .reveal {
        display: none;
        margin-top: 14px;
        border-top: 1px dashed var(--border);
        padding-top: 14px;
      }
      .reveal.show {
        display: block;
      }

      .navfoot {
        display: flex;
        justify-content: space-between;
        margin-top: 36px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }

      /* Run/Execute panel */
      .run-panel {
        margin-top: 18px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
      }
      .run-status {
        font-size: 12px;
        color: var(--text-dim);
        margin-bottom: 8px;
        min-height: 16px;
      }
      .run-status.loading {
        color: var(--warn);
      }
      .run-status.ready {
        color: var(--accent);
      }
      .run-status.error {
        color: var(--danger);
      }
      .run-output {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 14px;
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--code-text);
        white-space: pre-wrap;
        overflow-x: auto;
        max-height: 340px;
        overflow-y: auto;
      }
      .run-table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--mono);
        font-size: 12px;
      }
      .run-table th,
      .run-table td {
        border: 1px solid var(--border);
        padding: 5px 9px;
        text-align: left;
        white-space: nowrap;
      }
      .run-table th {
        background: var(--panel2);
        color: var(--text-dim);
        font-weight: 700;
        position: sticky;
        top: 0;
      }
      .run-table tr:nth-child(even) td {
        background: rgba(255, 255, 255, 0.02);
      }
      .btn.run {
        background: #2563a8;
        color: #fff;
        border-color: #2563a8;
      }
      .btn.run:hover {
        background: #2e73bf;
      }
      .btn.run:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .config-panel {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 18px;
      }
      .config-panel summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--text-dim);
        font-weight: 600;
      }
      .config-note {
        font-size: 12px;
        color: var(--text-dim);
        margin-top: 10px;
        line-height: 1.6;
      }
      code.inline {
        background: var(--panel2);
        padding: 1px 6px;
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--accent);
        border: 1px solid var(--border);
      }

      .howto-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 16px;
      }
      .howto-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 18px;
      }
      .howto-card h3 {
        margin: 0 0 8px;
        font-size: 14px;
        color: var(--accent);
      }
      .howto-card p {
        margin: 0;
        font-size: 13px;
        line-height: 1.65;
        color: var(--text-dim);
      }

      /* Intro / landing */
      .intro-wrap {
        min-height: 70vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 20px;
      }
      .intro-wrap .kicker {
        font-size: 12px;
        letter-spacing: 0.1em;
        color: var(--accent);
        margin-bottom: 14px;
      }
      .intro-wrap h1 {
        font-size: 34px;
        margin: 0 0 14px;
        font-weight: 800;
        max-width: 640px;
        line-height: 1.25;
      }
      .intro-wrap p.sub {
        font-size: 15px;
        color: var(--text-dim);
        max-width: 520px;
        margin: 0 0 34px;
        line-height: 1.65;
      }
      .intro-buttons {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
      }
      .intro-btn {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        text-align: left;
        padding: 18px 22px;
        border-radius: 12px;
        border: 1px solid var(--border);
        cursor: pointer;
        width: 230px;
        background: var(--panel);
        color: var(--text);
        font-family: var(--sans);
      }
      .intro-btn .icon {
        font-size: 20px;
      }
      .intro-btn .lbl {
        font-size: 15px;
        font-weight: 700;
      }
      .intro-btn .desc {
        font-size: 12.5px;
        color: var(--text-dim);
        line-height: 1.5;
      }
      .intro-btn.primary {
        background: var(--accent);
        color: #06231c;
        border-color: var(--accent);
      }
      .intro-btn.primary .desc {
        color: #0a3327;
      }
      .intro-btn:hover {
        transform: translateY(-2px);
        transition: transform 0.15s;
      }

      /* Tutorial */
      .tut-progress {
        display: flex;
        gap: 6px;
        margin-bottom: 22px;
      }
      .tut-dot {
        height: 6px;
        flex: 1;
        border-radius: 3px;
        background: var(--border);
      }
      .tut-dot.filled {
        background: var(--accent);
      }
      .tut-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 26px 28px;
        max-width: 640px;
      }
      .tut-card .level-tag {
        font-size: 11px;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 10px;
      }
      .tut-concept {
        font-size: 13.5px;
        color: var(--text-dim);
        line-height: 1.6;
        margin-bottom: 14px;
        padding: 10px 12px;
        background: var(--panel2);
        border-left: 3px solid var(--accent);
        border-radius: 4px;
      }
      .tut-card h2.tq {
        font-size: 15px;
        margin: 0 0 14px;
        font-weight: 700;
      }
      .tut-card pre {
        background: var(--code-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
        font-family: var(--mono);
        font-size: 13.5px;
        color: var(--code-text);
        margin: 0 0 16px;
        white-space: pre-wrap;
      }
      .tut-ref {
        margin: 0 0 16px;
      }
      .tut-ref-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-dim);
        margin-bottom: 8px;
      }
      .tut-ref-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .tut-ref-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel2);
      }
      .tut-ref-item .opt-letter {
        width: 20px;
        height: 20px;
        border-radius: 6px;
        background: var(--code-bg);
        color: var(--text-dim);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10.5px;
        font-weight: 700;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .tut-ref-item .opt-label {
        font-family: var(--mono);
        font-size: 12.5px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 2px;
      }
      .tut-ref-item .opt-desc {
        font-size: 12px;
        color: var(--text-dim);
        line-height: 1.45;
      }
      .tut-input {
        width: 100%;
        padding: 11px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--code-bg);
        color: var(--code-text);
        font-family: var(--mono);
        font-size: 14px;
      }
      .tut-input:focus {
        outline: none;
        border-color: var(--accent);
      }
      .tut-feedback {
        margin-top: 12px;
        font-size: 13px;
        padding: 10px 12px;
        border-radius: 8px;
        display: none;
        line-height: 1.6;
      }
      .tut-feedback.correct {
        display: block;
        background: rgba(79, 214, 176, 0.12);
        color: var(--accent);
        border: 1px solid var(--accent-dim);
      }
      .tut-feedback.wrong {
        display: block;
        background: rgba(226, 89, 107, 0.1);
        color: var(--danger);
        border: 1px solid var(--danger);
      }
      .tut-explain {
        font-size: 12.5px;
        color: var(--text-dim);
        margin-top: 8px;
        line-height: 1.6;
        display: none;
      }
      .tut-explain.show {
        display: block;
      }
      .tut-done {
        text-align: center;
        padding: 40px 20px;
      }
      .tut-done .big {
        font-size: 40px;
        margin-bottom: 10px;
      }

      @media (max-width: 900px) {
        .layout {
          flex-direction: column;
        }
        .sidebar {
          width: 100%;
          border-right: none;
          border-bottom: 1px solid var(--border);
          max-height: 220px;
        }
        .main {
          padding: 20px;
        }
        .howto-grid {
          grid-template-columns: 1fr;
        }
        .intro-wrap h1 {
          font-size: 26px;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="brand" onclick="goHome()">
        <span class="dot"></span>Practice Arena
      </div>
      <div class="test-select">
        <label for="testPicker">Pilih TEST</label>
        <select id="testPicker"></select>
      </div>
      <div class="progress-chip">
        Selesai: <b id="progressCount">0</b>/<span id="progressTotal">0</span>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Ganti tema">
        🌙
      </button>
    </div>

    <div class="layout">
      <div class="sidebar" id="sidebar"></div>
      <div class="main" id="main"></div>
    </div>

    <script>
      const TEST_DATA = {
        "TEST 1": [
          {
            no: 1,
            nama: "Sales Team Performance Dashboard",
            type: "sql",
            sections: {
              Intro: "",
              "Instruksi Soal":
                "Buat laporan performa penjualan per karyawan dengan analisis departemen. Tampilkan karyawan, departemennya, total penjualan, jumlah transaksi, rata-rata nilai transaksi, dan kategori performa.",
              Kriteria:
                "Kategori Performa:\n'Excellent': total penjualan > 5000\n'Good': total penjualan antara 2000-5000\n'Needs Improvement': total penjualan < 2000\nHanya tampilkan data tahun 2024\nUntuk karyawan tanpa departemen, tampilkan 'No Department'\nRata-rata transaksi dibulatkan ke 2 angka desimal\nUrutkan berdasarkan total penjualan tertinggi ke terendah",
              Notes:
                "Tampilkan hanya karyawan yang memiliki penjualan di tahun 2024\nData order tahun 2023 tidak dihitung\nKaryawan tanpa penjualan di 2024 tidak ditampilkan\nCodework sudah menyediakan tabel",
              "Skema Tabel":
                "Tabel employees:\n\nKolom Tipe Deskripsi\nemployee_id INTEGER ID karyawan\nemployee_name VARCHAR(100) Nama karyawan\ndepartment_id INTEGER ID departemen\n\nTabel departments:\n\nKolom Tipe Deskripsi\ndepartment_id INTEGER ID departemen\ndepartment_name VARCHAR(50) Nama departemen\n\nTabel orders:\n\nKolom Tipe Deskripsi\norder_id INTEGER ID pesanan\nemployee_id INTEGER ID karyawan penangan\norder_date DATE Tanggal pesanan\ntotal_amount DECIMAL(10,2) Total pembelian",
              "Contoh Data":
                "Departments:\n\ndepartment_id department_name\n1 Sales\n2 Marketing\n3 Customer Service\nNULL No Department\n\nEmployees:\n\nemployee_id employee_name department_id\n101 Alice Johnson 1\n102 Bob Smith 1\n103 Charlie Brown 2\n104 Diana Wilson NULL\n105 Eve Taylor 3\n\nOrders:\n\norder_id employee_id order_date total_amount\n1001 101 2024-01-15 1500.50\n1002 101 2024-02-20 800.00\n1003 101 2024-03-10 2200.00\n1004 102 2024-01-18 950.75\n1005 102 2024-02-25 1200.00\n1006 102 2024-03-15 1750.00\n1007 103 2024-01-20 650.25\n1008 103 2024-02-28 300.00\n1009 104 2024-03-05 890.50\n1010 105 2024-01-30 1100.00\n1011 105 2024-03-20 950.00\n1012 NULL 2024-02-10 500.00",
              "Ekspektasi Output":

      /* ----------------------------- Scaffold Hint (kode 70% jadi, 30% kosong) ----------------------------- */
      const SCAFFOLD_STRUCTURAL = new Set([
        "select",
        "from",
        "where",
        "group",
        "by",
        "order",
        "having",
        "join",
        "left",
        "right",
        "inner",
        "outer",
        "on",
        "as",
        "and",
        "or",
        "not",
        "in",
        "between",
        "case",

        "distinct",
        "limit",
        "def",
        "return",
        "if",
        "elif",
        "for",
        "while",
        "pass",
        "class",
        "import",
        "true",
        "false",
        "null",
        "none",
      ]);

      function scaffoldCode(code) {
        if (!code) return "";
        const tokenRegex =
          /[A-Za-z_][A-Za-z0-9_\.]*|[0-9]+(\.[0-9]+)?|'[^']*'|"[^"]*"|[><=!]=|[+\-*/%<>]/g;
        const lines = code.split("\n");
        const lineTokens = lines.map((line) => {
          const trimmed = line.trim();
          if (trimmed.startsWith("--") || trimmed.startsWith("#"))
            return { line, tokens: [] };
          const tokens = [];
          let m;
          tokenRegex.lastIndex = 0;
          while ((m = tokenRegex.exec(line)) !== null) {
            const val = m[0];
            const blankable = !SCAFFOLD_STRUCTURAL.has(val.toLowerCase());
            tokens.push({
              start: m.index,
              end: m.index + val.length,
              val,
              blankable,
            });
          }
          return { line, tokens };
        });

        const blankableRefs = [];
        lineTokens.forEach((lt, li) => {
          lt.tokens.forEach((t, ti) => {
            if (t.blankable) blankableRefs.push({ li, ti });
          });
        });

        const total = blankableRefs.length;
        const toBlank = Math.round(total * 0.3);
        if (total > 0 && toBlank > 0) {
          const step = total / toBlank;
          for (let i = 0; i < toBlank; i++) {
            const idx = Math.min(total - 1, Math.floor(i * step));
            const { li, ti } = blankableRefs[idx];
            lineTokens[li].tokens[ti].blank = true;
          }
        }

        return lineTokens
          .map((lt) => {
            if (!lt.tokens.length) return lt.line;
            let out = "";
            let cursor = 0;
            lt.tokens.forEach((t) => {
              out += lt.line.slice(cursor, t.start);
              out += t.blank ? "____" : t.val;
              cursor = t.end;
            });
            out += lt.line.slice(cursor);
            return out;
          })
          .join("\n");
      }

      /* =========================================================================
   EKSEKUSI NYATA: SQL (sql.js / SQLite via WASM) & Python (Pyodide via WASM)
   ========================================================================= */

      let _sqlJsPromise = null;
      function loadSqlJs() {
        if (_sqlJsPromise) return _sqlJsPromise;
        _sqlJsPromise = new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src =
            "https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/sql-wasm.js";
          script.onload = () => {
            initSqlJs({
              locateFile: (file) =>
                `https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${file}`,
            })
              .then(resolve)
              .catch(reject);
          };
          script.onerror = () =>
            reject(new Error("Gagal memuat sql.js dari CDN."));
          document.head.appendChild(script);
        });
        return _sqlJsPromise;
      }

                 let _pyodidePromise = null;

      const PYODIDE_SOURCES = [
        "./pyodide/",                                        // local copy (most reliable)
        "https://cdn.jsdelivr.net/npm/pyodide@0.26.4/full/",
        "https://fastly.jsdelivr.net/npm/pyodide@0.26.4/full/",
        "https://gcore.jsdelivr.net/npm/pyodide@0.26.4/full/",
        "https://unpkg.com/pyodide@0.26.4/full/",
      ];

      function loadScriptOnce(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = src;
          s.onload = resolve;
          s.onerror = () => {
            s.remove();
            reject(new Error("Gagal memuat " + src));
          };
          document.head.appendChild(s);
        });
      }

      function loadPyodide_() {
        if (_pyodidePromise) return _pyodidePromise;
        _pyodidePromise = (async () => {
          let lastErr;
          for (const base of PYODIDE_SOURCES) {
            try {
              if (typeof loadPyodide !== "function") {
                await loadScriptOnce(base + "pyodide.js");
              }
              return await loadPyodide({ indexURL: base });
            } catch (e) {
              lastErr = e;
              console.warn("Pyodide gagal dari", base, e);
              // force re-download of pyodide.js from the next mirror
              try { delete window.loadPyodide; } catch (_) { window.loadPyodide = undefined; }
            }
          }
          _pyodidePromise = null; // allow retry on next click
          throw new Error(
            "Gagal memuat Pyodide dari semua sumber: " +
              (lastErr && lastErr.message ? lastErr.message : lastErr)
          );
        })();
        return _pyodidePromise;
      }

      function setRunStatus(text, cls) {
        const el = document.getElementById("runStatus");
        if (!el) return;
        el.className = "run-status" + (cls ? " " + cls : "");
        el.textContent = text;
      }

      function renderResultTable(columns, rows) {
        if (!columns || !columns.length) {
          return '<div class="run-status">Query berhasil dijalankan, tidak ada kolom hasil (mungkin statement non-SELECT).</div>';
        }
        let html =
          '<div class="run-output" style="padding:0;"><table class="run-table"><thead><tr>';
        columns.forEach((c) => (html += `<th>${escapeHtml(c)}</th>`));
        html += "</tr></thead><tbody>";
        if (!rows.length) {
          html += `<tr><td colspan="${columns.length}" style="color:var(--text-dim);">(0 baris)</td></tr>`;
        } else {
          rows.forEach((r) => {
            html +=
              "<tr>" +
              r
                .map(
                  (v) =>
                    `<td>${v === null ? '<i style="color:var(--text-dim);">NULL</i>' : escapeHtml(String(v))}</td>`,
                )
                .join("") +
              "</tr>";
          });
        }
        html += "</tbody></table></div>";
        return html;
      }

      async function runSqlAnswer(test, no) {
        const btn = document.getElementById("runBtn");
        const outWrap = document.getElementById("runOutputWrap");
        const q = (TEST_DATA[test] || []).find((x) => x.no === no);
        const query = document.getElementById("answerBox").value.trim();

        if (!query) {
          setRunStatus(
            "Tulis query SQL kamu dulu di kotak Jawaban Kamu, baru klik Jalankan.",
            "error",
          );
          return;
        }

        btn.disabled = true;
        outWrap.innerHTML = "";
        setRunStatus("Menyiapkan SQLite (sql.js) di browser...", "loading");

        try {
          const SQL = await loadSqlJs();
          setRunStatus("Membangun database contoh dari soal ini...", "loading");
          const db = new SQL.Database();
          q.sql_init.forEach((stmt) => db.run(stmt));

          setRunStatus("Menjalankan query kamu...", "loading");
          let res;
          try {
            res = db.exec(query);
          } catch (execErr) {
            setRunStatus("Query error: " + execErr.message, "error");
            outWrap.innerHTML = `<div class="run-output">${escapeHtml(String(execErr.message))}</div>`;
            db.close();
            btn.disabled = false;
            return;
          }

          if (!res.length) {
            setRunStatus(
              "Query berhasil dijalankan (tidak menghasilkan baris/kolom).",
              "ready",
            );
            outWrap.innerHTML = "";
          } else {
            const { columns, values } = res[0];
            setRunStatus(
              `Berhasil dijalankan — ${values.length} baris dikembalikan. Bandingkan dengan Ekspektasi Output di atas.`,
              "ready",
            );
            outWrap.innerHTML = renderResultTable(columns, values);
          }
          db.close();
        } catch (err) {
          setRunStatus("Gagal menjalankan: " + err.message, "error");
        }
        btn.disabled = false;
      }

      async function runPythonAnswer(test, no) {
        const btn = document.getElementById("runBtn");
        const outWrap = document.getElementById("runOutputWrap");
        const code = document.getElementById("answerBox").value;

        if (!code.trim()) {
          setRunStatus(
            "Tulis kode Python kamu dulu di kotak Jawaban Kamu, baru klik Jalankan.",
            "error",
          );
          return;
        }

        btn.disabled = true;
        outWrap.innerHTML = "";
        setRunStatus(
          "Menyiapkan Python (Pyodide) di browser — biasanya agak lama untuk pemakaian pertama.",
          "loading",
        );

        try {
          const pyodide = await loadPyodide_();
          setRunStatus("Menjalankan kode kamu...", "loading");

          pyodide.setStdout({
            batched: (s) => {
              _pyStdoutBuffer += s + "\n";
            },
          });
          pyodide.setStderr({
            batched: (s) => {
              _pyStdoutBuffer += s + "\n";
            },
          });
          window._pyStdoutBuffer = "";
          _pyStdoutBuffer = "";

          let errorMsg = null;
          try {
            await pyodide.runPythonAsync(code);
          } catch (pyErr) {
            errorMsg = pyErr.message;
          }

          const output = _pyStdoutBuffer || "";
          if (errorMsg) {
            setRunStatus("Kode dijalankan, tapi ada error:", "error");
            outWrap.innerHTML = `<div class="run-output">${escapeHtml(output)}${output ? "\n" : ""}${escapeHtml(errorMsg)}</div>`;
          } else {
            setRunStatus(
              "Berhasil dijalankan. Output (jika ada print()) tampil di bawah — bandingkan dengan Contoh Output di soal.",
              "ready",
            );
            outWrap.innerHTML = `<div class="run-output">${output ? escapeHtml(output) : "(tidak ada output — tambahkan print(...) di kodemu untuk melihat hasil)"}</div>`;
          }
        } catch (err) {
          setRunStatus("Gagal menjalankan Python: " + err.message, "error");
        }
        btn.disabled = false;
      }
      var _pyStdoutBuffer = "";
    </script>
